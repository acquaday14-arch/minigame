<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Mini Games</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#1f2937;display:grid;place-items:center;min-height:100vh}
    .card{width:min(680px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:40px;box-shadow:0 18px 45px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 12px;font-size:clamp(32px,6vw,56px)}
    p{font-size:18px;line-height:1.6;margin:8px 0}
    .badge{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:999px;background:#eef2ff;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>🎮 English Mini Games</h1>
    <p>GitHub Pages is working.</p>
    <p>This will become the home page for your classroom mini games.</p>
    <div class="badge">Setup test: PASS ✅</div>
  </main>
</body>
</html>
