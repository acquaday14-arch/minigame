<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Mini Game Template</title>
  <style>
    :root{
      --bg:#f7f8fc; --card:#ffffff; --ink:#1f2937; --muted:#64748b;
      --line:#e5e7eb; --accent:#5b5bd6; --accent2:#8b5cf6;
      --soft:#eef2ff; --good:#15803d; --bad:#b91c1c;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#fafbff,#f3f5fa);color:var(--ink);min-height:100vh;padding:24px}
    button,input{font:inherit}
    .shell{width:min(820px,96vw);margin:5vh auto 0}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 50px rgba(31,41,55,.08);padding:28px}
    .hidden{display:none!important}
    .center{text-align:center}
    h1{font-size:clamp(32px,5vw,50px);margin:4px 0 10px}
    .sub{color:var(--muted);font-size:17px;line-height:1.6}
    .name{width:100%;padding:15px 16px;border:1px solid #cbd5e1;border-radius:14px;margin-top:18px}
    .btn{border:0;border-radius:14px;padding:13px 17px;font-weight:800;cursor:pointer}
    .primary{background:#111827;color:#fff}
    .startbtn{width:100%;margin-top:12px}
    .hud{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800;margin-bottom:14px}
    .progressTrack{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-bottom:22px}
    .progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.2s}
    .activity{display:inline-block;background:var(--soft);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
    .q{font-size:clamp(24px,4vw,34px);line-height:1.25;margin:16px 0 20px}
    .answers{display:grid;gap:10px}
    .answer{width:100%;background:#f3f5ff;border:1px solid transparent;border-radius:14px;padding:14px;font-weight:750;cursor:pointer;text-align:left}
    .answer:hover{border-color:#c7d2fe}
    .textAnswer{display:flex;gap:10px}
    .textAnswer input{flex:1;padding:14px;border:1px solid #cbd5e1;border-radius:14px}
    .feedback{min-height:28px;text-align:center;font-weight:850;margin:18px 0 4px}
    .good{color:var(--good)} .bad{color:var(--bad)}
    .controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px}
    .secondary{background:#eef2f7;color:#1f2937}
    .right{display:flex;gap:10px;flex-wrap:wrap}
    .resultScore{font-size:58px;font-weight:900;margin:12px 0}
    .timer{font-variant-numeric:tabular-nums}
    @media(max-width:560px){.textAnswer{flex-direction:column}.hud{align-items:flex-start;flex-direction:column}.right{width:100%}.right .btn{flex:1}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" id="startScreen">
      <div class="center">
        <div class="activity">Template</div>
        <h1 id="gameTitle">English Mini Game</h1>
        <p class="sub" id="gameSubtitle">Quick classroom practice • one question at a time</p>
      </div>
      <input class="name" id="studentName" placeholder="Enter your name" autocomplete="name" />
      <button class="btn primary startbtn" id="startBtn">Start Game</button>
    </section>

    <section class="panel hidden" id="gameScreen">
      <div class="hud">
        <span id="playerName"></span>
        <span>Score: <span id="score">0</span> · <span id="progressText">1/1</span> <span class="timer" id="timer"></span></span>
      </div>
      <div class="progressTrack"><div class="progressBar" id="progressBar"></div></div>
      <span class="activity" id="activityLabel">Practice</span>
      <div class="q" id="question"></div>
      <div id="answerArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="btn secondary" id="backBtn">← Back</button>
        <div class="right">
          <button class="btn secondary" id="soundBtn">🔊 Sound On</button>
          <button class="btn secondary" id="restartBtn">Restart</button>
          <button class="btn primary" id="nextBtn">Next →</button>
        </div>
      </div>
    </section>

    <section class="panel hidden center" id="resultScreen">
      <div class="activity">Finished</div>
      <h1>Great work!</h1>
      <p class="sub" id="resultName"></p>
      <div class="resultScore" id="finalScore">0/0</div>
      <p class="sub">You can restart and try again.</p>
      <button class="btn primary" id="playAgainBtn">Play Again</button>
    </section>
  </main>

  <script>
    // ===== EDIT THIS SECTION FOR EACH NEW GAME =====
    const CONFIG = {
      title: "English Mini Game",
      subtitle: "Quick classroom practice • one question at a time",
      timerEnabled: false,
      secondsPerQuestion: 20
    };

    const QUESTIONS = [
      {
        type: "mcq",
        activity: "Multiple Choice",
        prompt: "Choose the correct Past Simple form of go.",
        choices: ["goed", "went", "gone"],
        answer: 1
      },
      {
        type: "text",
        activity: "Fill in the Blank",
        prompt: "Yesterday, I ____ to school. (go)",
        answer: "went"
      },
      {
        type: "mcq",
        activity: "Quick Check",
        prompt: "Which sentence is correct?",
        choices: ["She visited her grandma.", "She visit her grandma yesterday.", "She visits her grandma yesterday."],
        answer: 0
      }
    ];
    // ===== END EDIT SECTION =====

    let index = 0, score = 0, locked = false, soundOn = true, timerId = null, timeLeft = 0;
    const answered = new Map();

    const $ = id => document.getElementById(id);
    $("gameTitle").textContent = CONFIG.title;
    $("gameSubtitle").textContent = CONFIG.subtitle;

    function tone(ok=true){
      if(!soundOn) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = ok ? 740 : 180;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(.07, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .18);
      osc.start(); osc.stop(ctx.currentTime + .18);
    }

    function start(){
      const name = $("studentName").value.trim();
      if(!name){ alert("Please enter your name."); return; }
      $("playerName").textContent = name;
      $("startScreen").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      render();
    }

    function render(){
      clearTimer();
      locked = answered.has(index);
      const q = QUESTIONS[index];
      $("activityLabel").textContent = q.activity || "Practice";
      $("question").innerHTML = q.prompt;
      $("progressText").textContent = (index+1) + "/" + QUESTIONS.length;
      $("progressBar").style.width = (((index+1)/QUESTIONS.length)*100) + "%";
      $("score").textContent = score;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("backBtn").disabled = index === 0;
      $("nextBtn").textContent = index === QUESTIONS.length-1 ? "Finish →" : "Next →";
      const area = $("answerArea");
      area.innerHTML = "";

      if(q.type === "mcq"){
        const box = document.createElement("div"); box.className = "answers";
        q.choices.forEach((choice,i)=>{
          const b = document.createElement("button");
          b.className = "answer"; b.textContent = choice;
          b.onclick = ()=>checkMcq(i);
          box.appendChild(b);
        });
        area.appendChild(box);
      }else{
        const box = document.createElement("div"); box.className = "textAnswer";
        const input = document.createElement("input"); input.id = "textInput"; input.placeholder = "Type your answer";
        input.addEventListener("keydown",e=>{ if(e.key==="Enter") checkText(); });
        const b = document.createElement("button"); b.className = "btn primary"; b.textContent = "Check"; b.onclick = checkText;
        box.append(input,b); area.appendChild(box);
      }

      if(answered.has(index)){
        const ok = answered.get(index);
        $("feedback").textContent = ok ? "Correct! ✅" : "Checked. Keep going 🙂";
        $("feedback").classList.add(ok ? "good" : "bad");
      }
      if(CONFIG.timerEnabled && !locked) startTimer();
      else $("timer").textContent = "";
    }

    function record(ok){
      if(locked) return;
      locked = true;
      answered.set(index, ok);
      if(ok){ score++; tone(true); $("feedback").textContent = "Correct! ✅"; $("feedback").className = "feedback good"; }
      else { tone(false); $("feedback").textContent = "Not quite. Keep going 🙂"; $("feedback").className = "feedback bad"; }
      $("score").textContent = score;
      clearTimer();
    }

    function checkMcq(i){ record(i === QUESTIONS[index].answer); }
    function checkText(){
      const input = $("textInput");
      if(!input) return;
      const expected = String(QUESTIONS[index].answer).trim().toLowerCase();
      record(input.value.trim().toLowerCase() === expected);
    }

    function next(){
      if(index < QUESTIONS.length-1){ index++; render(); }
      else finish();
    }
    function back(){ if(index>0){ index--; render(); } }
    function restart(){
      clearTimer(); index=0; score=0; answered.clear(); locked=false;
      $("resultScreen").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      render();
    }
    function finish(){
      clearTimer();
      $("gameScreen").classList.add("hidden");
      $("resultScreen").classList.remove("hidden");
      $("resultName").textContent = $("playerName").textContent;
      $("finalScore").textContent = score + "/" + QUESTIONS.length;
    }
    function startTimer(){
      timeLeft = CONFIG.secondsPerQuestion;
      $("timer").textContent = " · " + timeLeft + "s";
      timerId = setInterval(()=>{
        timeLeft--;
        $("timer").textContent = " · " + timeLeft + "s";
        if(timeLeft <= 0){
          clearTimer();
          if(!locked){
            locked = true; answered.set(index,false);
            $("feedback").textContent = "TIME'S UP!";
            $("feedback").className = "feedback bad";
            tone(false);
          }
        }
      },1000);
    }
    function clearTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
    function toggleSound(){ soundOn=!soundOn; $("soundBtn").textContent = soundOn ? "🔊 Sound On" : "🔇 Sound Off"; }

    $("startBtn").onclick=start;
    $("nextBtn").onclick=next;
    $("backBtn").onclick=back;
    $("restartBtn").onclick=restart;
    $("playAgainBtn").onclick=restart;
    $("soundBtn").onclick=toggleSound;
  </script>
</body>
</html>
