<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playful Challenge Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --purple:#5b36d6;--purple2:#7a57eb;--ink:#20285c;--pink:#ef5aa7;
      --yellow:#ffd76a;--mint:#6be0b2;--sky:#74c7ff;--soft:#f8f6ff;--line:#d9cff8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;padding:18px;
      font-family:"Fredoka",ui-rounded,"Trebuchet MS",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 9% 12%,#ffe2f0 0 7%,transparent 7.5%),
        radial-gradient(circle at 90% 14%,#dff5ff 0 8%,transparent 8.5%),
        linear-gradient(180deg,#f8fbff,#f4efff);
    }
    button,input{font:inherit}
    .app{width:min(1060px,98vw);margin:1vh auto}
    .frame{
      background:#fff;border:4px solid #4b32bf;border-radius:32px;overflow:hidden;
      box-shadow:0 14px 0 #ded5ff,0 24px 44px rgba(63,47,147,.14)
    }
    .top{
      background:linear-gradient(135deg,var(--purple),#6541dc);
      padding:18px 28px;color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center
    }
    .pill{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);padding:9px 15px;border-radius:999px;font-weight:700}
    .top .pill:last-child{justify-self:end}
    .progress{height:10px;background:#dacdfd}
    .progress>div{height:100%;width:25%;background:linear-gradient(90deg,#ffd75f,#ffae73);transition:.25s}
    .stage{padding:28px 34px 24px;min-height:650px;position:relative}
    .kicker{text-align:center;color:var(--pink);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{text-align:center;font-size:clamp(38px,6vw,62px);margin:8px 0 8px;color:#432cb5;line-height:.98}
    .instruction{text-align:center;font-size:20px;font-weight:600;margin-bottom:24px}
    .card{
      width:min(780px,100%);margin:0 auto;border:2px solid var(--line);border-radius:24px;padding:24px;
      background:linear-gradient(180deg,#fff,#fcfbff)
    }
    .question{font-size:clamp(24px,4vw,36px);font-weight:700;text-align:center;margin:6px 0 22px}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .answer{
      border:3px solid #ded3fa;background:#fbf9ff;border-radius:18px;padding:15px 18px;color:var(--ink);
      font-weight:700;font-size:18px;cursor:pointer;transition:.14s
    }
    .answer:hover{transform:translateY(-2px);border-color:#aa8df3}
    .answer.good{border-color:#65d5a8;background:#ebfff6;color:#17734e;animation:pop .28s ease}
    .answer.bad{border-color:#ff98a4;background:#fff0f2;color:#a63a47;animation:shake .28s ease}
    .feedback{min-height:42px;text-align:center;margin:18px 0 4px;font-size:19px;font-weight:700}
    .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-top:28px}
    .btn{border:2px solid #dbd2f8;border-radius:15px;background:#fff;color:#4734a9;padding:12px 18px;font-weight:700;cursor:pointer}
    .controls .next{justify-self:end;background:linear-gradient(135deg,#ffd37c,#ffbd84);border:0;color:#76563b}
    .center{text-align:center}
    .hidden{display:none!important}
    .start{padding:60px 32px;text-align:center}
    .start p{font-size:19px;color:#667085}
    .start input{width:min(560px,100%);padding:15px 17px;border:2px solid #d8cff4;border-radius:16px;font-size:18px}
    .start .btn{margin-top:12px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:0}
    .stars{font-size:26px;letter-spacing:5px}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
    .confetti i{position:absolute;width:10px;height:16px;border-radius:3px;animation:fall 900ms linear forwards}
    @keyframes pop{50%{transform:scale(1.035)}}
    @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(500deg);opacity:.7}}
    @media(max-width:700px){.top{grid-template-columns:1fr 1fr}.top>div:nth-child(2){grid-column:1/-1;grid-row:2;text-align:center}.stage{padding:22px 16px}.answers{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls .restart{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <section class="frame" id="startScreen">
      <div class="start">
        <div class="stars">⭐ ✨ ⭐</div>
        <div class="kicker">Playful classroom template</div>
        <h1>Present Tense Challenge</h1>
        <p>Bright arcade-style rounds, friendly sound effects, big buttons and celebration feedback.</p>
        <input id="nameInput" placeholder="Enter your name">
        <br>
        <button class="btn" id="startBtn">Start Challenge</button>
      </div>
    </section>

    <section class="frame hidden" id="gameScreen">
      <div class="top">
        <div class="pill" id="roundPill">Round 1 / 3</div>
        <div class="pill">⭐ <span id="score">0</span> / <span id="total">4</span> points</div>
        <div class="pill" id="questionPill">Question 1 / 4</div>
      </div>
      <div class="progress"><div id="bar"></div></div>

      <div class="stage">
        <div class="kicker" id="kicker">Quick choice · 1 of 4</div>
        <h1 id="title">Choose the best answer</h1>
        <div class="instruction" id="instruction">Pick the sentence that sounds natural.</div>

        <div class="card">
          <div class="question" id="question"></div>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="controls">
          <button class="btn" id="backBtn">← Back</button>
          <button class="btn restart" id="restartBtn">↻ Restart</button>
          <button class="btn next" id="nextBtn">Next →</button>
        </div>
      </div>
    </section>

    <div class="confetti" id="confetti"></div>
  </main>

<script>
const QUESTIONS=[
 {round:1,kicker:"Quick choice",title:"Present Simple",instruction:"Choose the correct sentence.",q:"Which sentence is correct?",choices:["She works in Sales.","She work in Sales.","She working in Sales."],a:0},
 {round:1,kicker:"Quick choice",title:"Present Continuous",instruction:"Choose the sentence for an action happening now.",q:"Mia is on a call right now.",choices:["She talks to a client.","She is talking to a client.","She talked to a client."],a:1},
 {round:2,kicker:"Office grammar",title:"Do or Does?",instruction:"Choose the correct question.",q:"_____ your manager work on Fridays?",choices:["Do","Does","Is"],a:1},
 {round:3,kicker:"Final burst",title:"Choose the best reply",instruction:"Pick the most natural workplace response.",q:"What are you working on today?",choices:["I prepare the report now.","I'm preparing the report.","I prepared every day."],a:1}
];
let i=0,score=0,locked=false,sound=true;
const $=x=>document.getElementById(x);
$("total").textContent=QUESTIONS.length;
function tone(ok){
 if(!sound)return;
 const c=new (AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
 o.type="sine";o.frequency.value=ok?780:180;o.connect(g);g.connect(c.destination);
 g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);
 o.start();o.stop(c.currentTime+.23);
}
function start(){
 if(!$("nameInput").value.trim()){alert("Enter your name first.");return;}
 $("startScreen").classList.add("hidden");$("gameScreen").classList.remove("hidden");render();
}
function render(){
 locked=false;const q=QUESTIONS[i];
 $("roundPill").textContent="Round "+q.round+" / 3";
 $("questionPill").textContent="Question "+(i+1)+" / "+QUESTIONS.length;
 $("bar").style.width=((i+1)/QUESTIONS.length*100)+"%";
 $("kicker").textContent=q.kicker+" · "+(i+1)+" of "+QUESTIONS.length;
 $("title").textContent=q.title;$("instruction").textContent=q.instruction;$("question").textContent=q.q;
 $("feedback").textContent="";$("answers").innerHTML="";
 q.choices.forEach((x,idx)=>{
   const b=document.createElement("button");b.className="answer";b.textContent=x;
   b.onclick=()=>answer(idx,b);$("answers").appendChild(b);
 });
 $("backBtn").disabled=i===0;$("nextBtn").textContent=i===QUESTIONS.length-1?"Finish →":"Next →";
}
function answer(idx,b){
 if(locked)return;locked=true;const q=QUESTIONS[i],ok=idx===q.a;
 if(ok){score++;$("score").textContent=score;b.classList.add("good");$("feedback").textContent="Correct! ⭐";tone(true);burst();}
 else{b.classList.add("bad");$("feedback").textContent="Not quite — try the next one!";tone(false);[...$("answers").children][q.a].classList.add("good");}
}
function next(){if(i<QUESTIONS.length-1){i++;render()}else{alert("Finished! Score: "+score+"/"+QUESTIONS.length)}}
function back(){if(i>0){i--;render()}}
function burst(){
 const box=$("confetti"),colors=["#ffd76a","#ef5aa7","#6be0b2","#74c7ff","#7656ea"];
 for(let n=0;n<24;n++){const x=document.createElement("i");x.style.left=Math.random()*100+"vw";x.style.background=colors[n%colors.length];x.style.animationDelay=Math.random()*140+"ms";box.appendChild(x);setTimeout(()=>x.remove(),1200)}
}
$("startBtn").onclick=start;$("nextBtn").onclick=next;$("backBtn").onclick=back;$("restartBtn").onclick=()=>location.reload();
</script>
</body>
</html>
